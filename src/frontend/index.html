<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUMP Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
          <span>SUMP Studio</span>
        </div>
        <button id="btn-new-session" class="btn-new-session">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          新会话
        </button>
      </div>
      <div id="session-list"></div>
      <div id="sidebar-footer"><span class="version">v0.1.0</span></div>
    </aside>

    <!-- Main -->
    <main id="main">
      <!-- Header -->
      <header id="header-bar">
        <div id="session-title"><span id="current-session-name">SUMP Studio</span></div>
        <div id="header-actions">
          <button id="btn-settings" class="btn-settings" title="设置中心">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat -->
      <div id="chat-container">
        <div id="chat-messages">
          <div class="welcome">
            <div class="welcome-icon">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <h2>欢迎使用 SUMP Studio</h2>
            <p>智能记忆平台 · 流式对话 · 深度思考</p>
            <div class="welcome-hints"><span>试试问我：帮我分析一个复杂问题</span></div>
          </div>
        </div>
      </div>
      <div id="input-area">
        <div id="image-preview" class="image-preview hidden"></div>
        <div class="input-wrapper">
          <button id="btn-attach" class="btn-attach" title="添加图片" aria-label="添加图片">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden />
          <textarea id="input-message" placeholder="输入消息… (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
          <button id="btn-send" class="btn-send" title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- 设置中心（全屏页面） -->
  <div id="settings-center" class="sc-page">
    <header class="sc-topbar">
      <button id="btn-sc-close" class="sc-back" type="button" title="返回" aria-label="返回">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>返回</span>
      </button>
      <h3 class="sc-page-title">设置中心</h3>
      <div class="sc-topbar-actions">
        <span id="sc-status" class="sc-status" role="status" aria-live="polite"></span>
        <button id="btn-sc-restart" class="sc-btn sc-btn-ghost" type="button">重启</button>
        <button id="btn-sc-save" class="sc-btn sc-btn-primary" type="button">保存</button>
      </div>
    </header>
    <div class="sc-layout">
      <aside class="sc-sidebar" id="sc-sidebar"></aside>
      <main class="sc-content">
        <div class="sc-panel" id="sc-panel"></div>
        <div class="sc-panel" id="sc-panel-session" hidden>
          <h2 class="sc-panel-title">会话偏好<span class="sc-section-note">即改即用，无需保存</span></h2>
          <div class="settings-item">
            <label>模型</label>
            <div class="custom-select" id="custom-select-model">
              <button class="cs-trigger" data-value="deepseek-flash">
                <span class="cs-label">DeepSeek V4.1 Flash</span>
                <svg class="cs-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="cs-options">
                <div class="cs-options-inner">
                  <button class="cs-option selected" data-value="deepseek-flash">DeepSeek V4.1 Flash</button>
                  <button class="cs-option" data-value="deepseek-v4-pro">DeepSeek V4 Pro</button>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-item settings-toggle-row">
            <label>深度思考</label>
            <button id="toggle-thinking" class="toggle" role="switch" aria-checked="false"></button>
          </div>
          <div id="effort-section" class="settings-collapse">
            <div class="settings-item">
              <label>思考强度</label>
              <div class="custom-select" id="custom-select-effort">
                <button class="cs-trigger" data-value="high">
                  <span class="cs-label">高</span>
                  <svg class="cs-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="cs-options">
                  <div class="cs-options-inner">
                    <button class="cs-option" data-value="low">低</button>
                    <button class="cs-option selected" data-value="high">高</button>
                    <button class="cs-option" data-value="max">最大</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="settings-item settings-toggle-row">
              <label>自动展开思考内容</label>
              <button id="toggle-track-thinking" class="toggle active" role="switch" aria-checked="true"></button>
            </div>
          </div>
          <div class="settings-item settings-toggle-row">
            <label>低危自动同意</label>
            <button id="toggle-auto-approve" class="toggle" role="switch" aria-checked="false"></button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
