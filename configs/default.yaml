# SUMP 默认配置
agent:
  name: "SUMP"
  max_rounds: 10                       # 工具调用最大轮次
  context_window: 50                    # 上下文窗口消息数
  inject_reasoning: false               # 恢复历史会话时是否注入推理内容（默认不注入，节省 token）

memory:
  owner_marker: "·主人"                 # 主人消息标记（记忆只提炼带此标记的消息）
  working:
    backend: "disk"                # memory / disk（默认磁盘）
    max_bytes: 102400              # 容量上限（字节）
    db_path: "data/working.db"     # disk 后端时的数据库
  session:
    db_path: "data/session.db"
    max_episodes: 10000
  shallow:
    db_path: "data/shallow.db"
    priority_threshold: 60              # 低价值丢弃阈值（<60 不写入）
  deep:
    db_path: "data/deep.db"
    embedding_model: "BAAI/bge-small-zh-v1.5"   # 本地 embedding 模型
    embedding_cache: "data/models"               # 模型缓存目录（首次联网下载后离线可用）
    priority_threshold: 70                       # 核心信息升级阈值（<70 不升级）
    inject_count: 5                              # 核心强制注入条数（按 priority 取 top，少量即可保证一致性，其余走相关召回）
    top_k: 10
  scene:
    db_path: "data/scene.db"            # L2 场景层（浅层原子记忆的聚合总结）
  archive:
    db_path: "data/archive.db"           # 历史会话归档副本（提取后从会话记忆移入，智能体不可见）
  state:
    db_path: "data/state.db"             # 巩固增量游标（session_msg_id / shallow_id）
  retention_days: 365                    # 记忆保留天数（<3 禁用回收；80% 安全阈值防误删）
  max_shallow_entries: 2000              # 浅层条数上限（超限触发 LLM 压缩保底）
  max_deep_entries: 50                   # 深层条数上限（核心信息，严格限制大小）
  recall:
    max_results: 5                       # 召回注入条数上限
    max_chars: 800                       # 相关召回注入字符预算
    core_max_chars: 400                  # 核心强制注入字符预算（独立于相关召回）
    timeout: 3.0                         # 召回超时（秒）
  soul:
    files: ["SOUL.md", "AGENTS.md"]       # 注入为 system prompt 的人格文件（根目录，不存在则跳过）
    max_bytes: 5000                       # 注入与精简的字节上限

deepseek:
  api_key: ""                           # 或通过环境变量 DEEPSEEK_API_KEY 设置
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"            # deepseek-v4-flash / deepseek-v4-pro
  vision_model: "deepseek-v4-flash-vision-exp"   # 视觉模型（仅图像工具用）
  reasoning_effort: "high"              # low / high / max（仅 thinking_enabled=true 时生效）
  thinking_enabled: false               # 是否启用思维链推理（默认关闭，按需开启）
  max_tokens: 4096
  temperature: 1.0                      # 仅在 thinking_enabled=false 时生效
  max_retries: 3                        # API 调用失败最大重试次数
  retry_delay: 1.0                      # 重试间隔（秒），指数退避

tools:
  builtin:
    file: {enabled: true}
    shell: {enabled: true, timeout: 30, platform: "auto"}   # platform: windows / linux / auto / 自定义提示词原文
    search: {enabled: true}
    web: {enabled: true, timeout: 10}
    datetime: {enabled: true}
  mcp:
    enabled: false
    servers: []

skills:
  auto_create: true
  proficiency_threshold: 0.7
  permanent_dir: "skills/permanent"     # 永久技能持久化目录（按 proficiency 分子目录）

evaluation:
  enabled: true                         # 工具循环中的内部评估（v4-flash 不思考）
  finish_threshold: 0.8                 # score >= 阈值视为任务完成
  retry_threshold: 0.5                  # score < 阈值视为需要重试

security:
  interceptor:
    enabled: true
  scanner:
    enabled: true
  judge:
    enabled: true
    threshold: 0.5
  notify_safe: true                    # true=安全命令也推送通知事件给前端
  approval_timeout: 30                 # 审批挂起超时秒数，超时自动拒绝

debug:
  log_level: "INFO"
  log_file: "data/logs/sump.log"         # 日志文件（API 服务启动时创建）
  trace_enabled: false
  key_output_enabled: true

sleep:
  enabled: true                        # 是否启用睡眠生理机制
  consolidate_on_startup: false        # 是否每次启动时先执行一次记忆巩固
  window: ["02:00", "07:00"]           # 可进入睡眠的时间段 [开始, 结束]（HH:MM，支持跨午夜）
  idle_minutes: 30                     # 距上次本体调用的空闲分钟数阈值
  deepen_after_seconds: 300            # 浅睡持续多少秒后进入深睡（开始记忆整理）
  tick_interval_seconds: 10            # 后台生理节拍检查间隔（秒）

events:
  db_path: "data/event.db"             # 事件存档数据库（append-only，暂不删除）

napcat:
  enabled: true                        # 是否启用 NapCat QQ 适配（正向 WebSocket 客户端）
  ws_url: "ws://127.0.0.1:3000"        # NapCat 正向 WebSocket 地址
  access_token: ""                     # OneBot access_token（本地敏感值放 configs/local.yaml，SUMP_ENV=local 加载）
  owner_id: ""                         # 主人 QQ 号（零信任：仅主人可执行，空则拒绝所有人；本地值放 configs/local.yaml）
  name: "星宝"                          # 机器人名字（群聊里提到该名字增加说话权重）
  image_dir: "data/napcat_images"       # QQ 图片下载保存目录（内网 URL 云端不可达，下载到本地供识别）
  image_retention_days: 7               # QQ 图片缓存保留天数（睡眠巩固时清理超期文件）
