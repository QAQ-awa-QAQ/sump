# SUMP 默认配置
agent:
  name: "SUMP"
  model: "gpt-4o"
  max_rounds: 50
  temperature: 0.7

memory:
  working:
    max_items: 100
    ttl_seconds: 600
  shallow:
    db_path: "data/memory.db"
    max_episodes: 10000
  deep:
    db_path: "data/memory.db"
    embedding_model: "text-embedding-3-small"
    top_k: 10

tools:
  builtin:
    file: {enabled: true}
    shell: {enabled: true, timeout: 30}
    search: {enabled: true}
    web: {enabled: true, timeout: 10}
    datetime: {enabled: true}
  mcp:
    enabled: false
    servers: []

skills:
  auto_create: true
  proficiency_threshold: 0.7

security:
  interceptor:
    enabled: true
  scanner:
    enabled: true
  judge:
    enabled: true
    threshold: 0.5

debug:
  log_level: "INFO"
  trace_enabled: false
  key_output_enabled: true
