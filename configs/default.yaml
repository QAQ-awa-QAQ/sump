# SUMP 默认配置
agent:
  name: "SUMP"
  model: "gpt-4o"
  max_rounds: 50
  temperature: 0.7

memory:
  working:
    max_items: 100
    ttl_seconds: 600
  shallow:
    db_path: "data/memory.db"
    max_episodes: 10000
  deep:
    db_path: "data/memory.db"
    embedding_model: "text-embedding-3-small"
    top_k: 10

deepseek:
  api_key: ""                           # 或通过环境变量 DEEPSEEK_API_KEY 设置
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"            # deepseek-v4-flash / deepseek-v4-pro
  reasoning_effort: "high"              # low / high / max（仅 thinking_enabled=true 时生效）
  thinking_enabled: false               # 是否启用思维链推理（默认关闭，按需开启）
  max_tokens: 4096
  temperature: 1.0                      # 仅在 thinking_enabled=false 时生效

tools:
  builtin:
    file: {enabled: true}
    shell: {enabled: true, timeout: 30}
    search: {enabled: true}
    web: {enabled: true, timeout: 10}
    datetime: {enabled: true}
  mcp:
    enabled: false
    servers: []

skills:
  auto_create: true
  proficiency_threshold: 0.7

security:
  interceptor:
    enabled: true
  scanner:
    enabled: true
  judge:
    enabled: true
    threshold: 0.5

debug:
  log_level: "INFO"
  trace_enabled: false
  key_output_enabled: true
